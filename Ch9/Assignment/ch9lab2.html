<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Trip Request</title>
    <link rel="stylesheet" href="ch9lab.css">
</head>

<body>

    <h1>Trip Request</h1>

    <form id="request"
          method="post"
          action="https://formsubmit.co/henok.a.tilahun@gmail.com">

        <input type="hidden"
               name="_subject"
               value="New Trip Request">

        <input type="hidden"
               name="_next"
               value="https://henoktilahun2007.github.io/MyNewRepo/Ch9/Assignment/ch9lab2.html">

        <p class="request-row">
            <label for="name">Full Name:</label>
            <input type="text"
                   id="name"
                   name="name"
                   required>
        </p>

        <p class="request-row">
            <label for="email">E-mail:</label>
            <input type="email"
                   id="email"
                   name="email"
                   required>
        </p>

        <p class="request-row">
            <label for="blog">Your travel blog:</label>
            <input type="url"
                   id="blog"
                   name="blog"
                   placeholder="https://">
        </p>

        <p class="request-row">
            <label for="travelers">Number of travelers:</label>
            <input type="number"
                   id="travelers"
                   name="travelers"
                   min="1"
                   max="12"
                   value="2">
        </p>

        <p class="request-row">
            <label for="departure">Departure date:</label>
            <input type="date"
                   id="departure"
                   name="departure"
                   min="2027-01-01">
        </p>

        <p class="request-row">
            <label for="budget">Budget:</label>
            <input type="range"
                   id="budget"
                   name="budget"
                   min="500"
                   max="5000"
                   step="100"
                   value="2500">
        </p>

        <p class="request-row">
            <label for="foldercolor">Trip folder color:</label>
            <input type="color"
                   id="foldercolor"
                   name="foldercolor">
        </p>

        <p class="request-row">
            <label for="city">Favorite city:</label>
            <input type="text"
                   id="city"
                   name="city"
                   list="cities">

            <datalist id="cities">
                <option value="Paris">
                <option value="Tokyo">
                <option value="Rome">
                <option value="Seoul">
            </datalist>
        </p>

        <p class="request-row">
            <label for="postal">ZIP or postal code:</label>
            <input type="text"
                   id="postal"
                   name="postal"
                   pattern="[0-9]{5}(-[0-9]{4})?"
                   title="Enter a 5-digit ZIP code or ZIP+4, such as 37211 or 37211-1234">
        </p>

        <p class="request-submit">
            <button type="submit">Send Trip Request</button>
        </p>

    </form>

    <footer>
        <p>Henok Tilahun</p>
        <p>
            <a href="mailto:henok.a.tilahun@gmail.com">
                henok.a.tilahun@gmail.com
            </a>
        </p>
    </footer>

</body>

</html>
